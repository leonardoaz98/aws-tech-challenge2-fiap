[project]
name = "tech-challenge-f2-aws"
version = "1.0.0"
description = "Pipeline hibrida (batch + streaming) para analise da alfabetizacao no Brasil, em AWS"
requires-python = ">=3.10"
dependencies = [
    "basedosdados>=2.0",
    "pandas-gbq>=0.22",
    "awswrangler>=3.5",
    "boto3>=1.34",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.32", "plotly>=5.20"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config", "quality"]
